[versions]
# Kotlin & Gradle
kotlin = "2.2.10"
gradlePlugin = "8.12.1"
kotlinSerializationPlugin = "2.2.10"
kspPlugin = "2.2.10-2.0.2"

# AndroidX Core & UI
coreKtx = "1.17.0"
appCompat = "1.7.1"
coreSplashscreen = "1.0.1"
activityKtx = "1.10.1"
constraintLayout = "2.2.1"
cardView = "1.0.0"
fragmentKtx = "1.8.9"
legacySupportV4 = "1.0.0"
viewPager2 = "1.1.0"
material = "1.12.0"
lottie = "6.6.7"

# Compose
composeRuntime = "1.9.0"

# Lifecycle & Navigation
lifecycle = "2.9.2"
navigation = "2.9.3"

# Paging
paging = "3.3.6"

# Hilt DI
hilt = "2.57"
hiltNavigationFragment = "1.2.0"

# Coroutines
coroutines = "1.10.2"

# Google Play Services
playServicesAuth = "21.4.0"
playServicesLocation = "21.3.0"
playServicesMaps = "19.2.0"
playServicesAds = "24.5.0"
places = "4.4.1"
googleId = "1.1.1"
credentials = "1.5.0"

# Firebase
firebaseBom = "34.1.0"
firebaseAds = "23.6.0"
firebaseCrashlyticsPlugin = "3.0.6"
googleServicesPlugin = "4.4.3"

# 기타 라이브러리
aztec = "v1.6.2"
coilVersion = "2.1.0"
glide = "4.16.0"
instantsearchAndroidPaging3 = "3.3.2"
circleImageView = "3.1.0"
kakaoSdk2 = "2.21.6"
desugarJdkLibs = "2.1.5"
exifinterface = "1.4.1"
datastorePreferencesAndroid = "1.1.7"

# OSS Licenses
ossLicensesPlugin = "0.10.6"
googleOssLicenses = "17.2.2"

# 테스트
junit4 = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"


[libraries]
# AndroidX Core & UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appCompat" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
androidx-datastore-preferences-android = { module = "androidx.datastore:datastore-preferences-android", version.ref = "datastorePreferencesAndroid" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-hilt-navigation-fragment = { module = "androidx.hilt:hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }
aztec = { module = "org.wordpress:aztec", version.ref = "aztec" }
coil-kt-coil = { module = "io.coil-kt:coil", version.ref = "coilVersion" }
firebase-ads = { module = "com.google.firebase:firebase-ads", version.ref = "firebaseAds" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
instantsearch-android-paging3 = { module = "com.algolia:instantsearch-android-paging3", version.ref = "instantsearchAndroidPaging3" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardView" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewPager2" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }

# Compose
androidx-runtime-android = { group = "androidx.compose.runtime", name = "runtime-android", version.ref = "composeRuntime" }
androidx-runtime-desktop = { group = "androidx.compose.runtime", name = "runtime-desktop", version.ref = "composeRuntime" }
androidx-ui-text-android = { group = "androidx.compose.ui", name = "ui-text-android", version.ref = "composeRuntime" }

# Lifecycle
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Paging
androidx-paging-common-ktx = { module = "androidx.paging:paging-common-ktx", version.ref = "paging" }
androidx-paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-test = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Coroutines
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Google / Play Services
gms-play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
places = { module = "com.google.android.libraries.places:places", version.ref = "places" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# 기타 UI
circleimageview = { module = "de.hdodenhof:circleimageview", version.ref = "circleImageView" }
kakao-sdk-v2-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakaoSdk2" }

# OSS Licenses
android-gms-oos-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "googleOssLicenses" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# 기타
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }


[plugins]
# Android & Kotlin
android-application = { id = "com.android.application", version.ref = "gradlePlugin" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerializationPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspPlugin" }

# Hilt
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Google & Firebase
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
google-oss-licenses = { id = "com.geekorum.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }